[pytest]
testpaths = tests
python_files = test_*.py

# Put the repository root on sys.path.
#
# tests/ has no __init__.py, so pytest inserts only tests/ and the app packages
# (auth, products, extensions...) are invisible. `python -m pytest` happens to
# add the working directory and hides this; bare `pytest`, which is what CI
# runs, does not. Setting it here means the suite behaves the same either way.
pythonpath = .
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
